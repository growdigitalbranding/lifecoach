<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Maren Vale">
  <rect width="64" height="64" fill="#14110f"/>
  <!-- An M and a V sharing a stroke: the monogram, drawn rather than set,
       so it stays legible at 16px where a serif face would not. -->
  <path d="M12 44V20l10 14 10-14v24" fill="none" stroke="#f7f2ea" stroke-width="4"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M38 20l7 24 7-24" fill="none" stroke="#b8563a" stroke-width="4"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
